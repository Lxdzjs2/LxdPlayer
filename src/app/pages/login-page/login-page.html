<div class="gradinet-spalnavas flex flex-col items-center justify-center min-h-screen w-full bg-gradient-to-br from-fuchsia-950 ">
  <div class="bg-white/20 w-70 h-100 lg:w-100 lg:h-100 rounded-2xl shadow-2xl">
          <h2 class="block text-center mt-5 sm:mt-7 font-bold text-3xl text-white f">
            Регистрация
          </h2>
        <form class="gap-8 flex flex-col px-4 py-5">
          <input
            type="text"
            placeholder="Введите ник"
            [(ngModel)]="names"
            name="names"
            class="text-white border-2 rounded-2xl bg-black/10 px-2 py-3 border-red-950 hover:outline-3 outline-green-300 hover:scale-102 transition-all"

          />
          <input type="password"
                 placeholder="Введите пароль"
                 [(ngModel)]="passwords"
                 name="password"
                 class="text-white border-2 rounded-2xl bg-black/10 px-2 py-3 border-red-950 hover:outline-3 outline-blue-500 hover:scale-102 transition-all"
          />
            @if (passwords.length < 6 ) {
              <button
                class="ml-6 mr-6 relative px-6 py-2 font-bold text-white rounded-lg overflow-hidden"
                (click)="onLogin()">
                <span
                  class="absolute inset-0 bg-gradient-to-r from-purple-300 via-pink-200 to-red-300
            bg-[length:200%_200%] animate-[gradient-move_5s_ease_infinite]">
              </span>
                <span class="relative z-10">Войти</span>
              </button>
            } @else {
              <button
                class="ml-6 mr-6 relative px-6 py-2 font-bold text-white rounded-lg overflow-hidden"
                (click)="onLogin()">
                <span
                  class="absolute inset-0 bg-gradient-to-r from-purple-600 via-pink-500 to-red-500
            bg-[length:200%_200%] animate-[gradient-move_5s_ease_infinite]">
              </span>
                <span class="relative z-10">Войти</span>
              </button>
            }
          <p class="text-gray-900 text-center font-bold">Чисто условная страница вводить верные данные необязательно</p>
        </form>
      </div>
</div>

<router-outlet></router-outlet>
